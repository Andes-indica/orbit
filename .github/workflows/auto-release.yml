name: Automated Releases

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
concurrency:
  group: automated-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    name: Create dated tag and release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun for scripts
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install JS/TS deps
        run: bun install --frozen-lockfile

      - name: Build release notes (TypeScript)
        id: build_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          since_date: ${{ steps.since.outputs.since_date }}
        run: |
          set -euo pipefail
          bun ./scripts/release-notes.ts
          echo "notes_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

          for area, prs_list in areas.items():
            title = area.replace('area:', 'Area: ')
            body += f"## {title}\n"
            for pr in prs_list:
              body += f"- {pr['title']} (#{pr['number']} {pr['html_url']})\n"
            body += '\n'

          if not breaking and not areas:
            body += 'No merged pull requests found since the last tag.\n'

          with open('RELEASE_NOTES.md','w') as f:
            f.write(body)
          print('WROTE RELEASE_NOTES.md')
          # write output using the environment file instead of deprecated set-output
          # the step runner will append this to $GITHUB_OUTPUT
          PY
          echo "notes_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create dated tag
        id: create_tag
        run: |
          set -euo pipefail
          BASE_TAG=$(date -u +%Y.%m.%d)
          TAG="$BASE_TAG"
          COUNT=0
          while git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; do
            COUNT=$((COUNT+1))
            TAG="$BASE_TAG-$COUNT"
          done
          echo "Tag will be: $TAG"
          git tag -a "$TAG" -m "Automated release $TAG" $GITHUB_SHA
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${{ steps.create_tag.outputs.tag }}
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "No release notes found, creating placeholder."
            echo "Automated release for ${GITHUB_SHA}" > RELEASE_NOTES.md
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file RELEASE_NOTES.md
